<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>樹木点検 現地入力 | Urban Forest Eco JP</title>
<meta name="theme-color" content="#2F6B58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --ink:#14231C; --ink2:#4A5B52; --paper:#FFFFFF; --field:#F1F4F0; --line:#C9D2C6;
  --green:#2F6B58; --green-d:#1F4A3C; --amber:#A85F00; --amber-bg:#FFF3DE;
  --red:#A32017; --red-bg:#FDEDEC; --blue:#1F4E79; --blue-bg:#E8F0F8;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",Meiryo,sans-serif;
  background:var(--field); color:var(--ink); font-size:16px; line-height:1.5;
  padding-bottom:132px;
}
button,input,select,textarea{font:inherit;color:inherit}

/* ---- top bar ---- */
header{
  position:sticky; top:0; z-index:30; background:var(--green); color:#fff;
  padding:8px 12px calc(8px + env(safe-area-inset-top,0)) 12px;
  padding-top:calc(8px + env(safe-area-inset-top,0));
}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.htitle{font-size:15px;font-weight:700;letter-spacing:.02em;margin-right:auto}
.badge{font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.18);white-space:nowrap}
.badge.off{background:#7A2E28}
.tabs{display:flex;gap:6px;margin-top:8px}
.tabs button{
  flex:1;padding:9px 0;border:0;border-radius:8px;background:rgba(255,255,255,.14);
  color:#fff;font-size:15px;font-weight:600
}
.tabs button[aria-selected="true"]{background:#fff;color:var(--green-d)}

/* ---- layout ---- */
main{max-width:760px;margin:0 auto;padding:12px}
section.block{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
section.block>h2{
  margin:0;font-size:15px;font-weight:700;padding:12px 14px;background:var(--green);color:#fff;
  display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none
}
section.block>h2 .cnt{margin-left:auto;font-size:13px;font-weight:600;background:rgba(255,255,255,.2);border-radius:999px;padding:2px 9px}
section.block>h2 .caret{transition:transform .15s}
section.block.collapsed>h2 .caret{transform:rotate(-90deg)}
section.block.collapsed .body{display:none}
.body{padding:4px 0}

.f{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid #EDF0EC}
.f:last-child{border-bottom:0}
.f>label{flex:0 0 40%;font-size:14px;color:var(--ink2);line-height:1.3}
.f>.c{flex:1;min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:11px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);
  font-size:17px;min-height:46px
}
textarea{min-height:84px;resize:vertical;font-size:16px}
input:focus,select:focus,textarea:focus{outline:3px solid #9BC2B4;outline-offset:1px;border-color:var(--green)}
.hint{font-size:12px;color:var(--ink2);padding:2px 14px 10px}

/* ---- chips ---- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{
  min-width:52px;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--paper);font-size:17px;font-weight:600
}
.chips button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chips.wrap6 button{min-width:44px}
.chips.ranges button{flex:1 1 calc(33.333% - 6px);min-width:96px;padding:0 8px;font-size:15px}

/* ---- toggles ---- */
.tg{display:flex;align-items:center;gap:12px;width:100%;padding:0 14px;min-height:56px;
  border:0;border-bottom:1px solid #EDF0EC;background:var(--paper);text-align:left;font-size:16px}
.tg:last-child{border-bottom:0}
.tg .mark{flex:0 0 34px;height:34px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:19px;font-weight:700;color:transparent}
.tg[aria-pressed="true"]{background:var(--amber-bg)}
.tg[aria-pressed="true"] .mark{border-color:var(--amber);color:var(--amber)}
.tg[aria-pressed="true"] .t{font-weight:700}

/* ---- stems ---- */
.stems{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 10px}
.stems input{font-size:17px}
.stems .lb{font-size:12px;color:var(--ink2);margin-bottom:2px}

/* ---- result bar ---- */
.resultbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);
  border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(20,35,28,.10);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom,0)) 12px
}
.rgrid{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.rtext{flex:1;min-width:0}
.rline1{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rline2{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;margin-right:5px}
.pill.ok{background:#E4F0EA;color:var(--green-d)}
.pill.warn{background:var(--amber-bg);color:var(--amber)}
.pill.bad{background:var(--red-bg);color:var(--red)}
.save{flex:0 0 auto;min-height:52px;padding:0 22px;border:0;border-radius:10px;background:var(--green);color:#fff;font-size:17px;font-weight:700}
.save:disabled{background:#B7C3BC}
.save.sec{background:var(--paper);color:var(--green-d);border:2px solid var(--green)}

/* ---- list ---- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.card .no{font-size:18px;font-weight:700;flex:0 0 auto}
.card .meta{flex:1;min-width:0;font-size:14px;color:var(--ink2)}
.card .meta b{color:var(--ink);font-size:16px;font-weight:700}
.card button{border:1px solid var(--line);background:var(--paper);border-radius:8px;min-height:44px;padding:0 14px;font-size:15px}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toolbar button{flex:1;min-height:48px;border:1px solid var(--line);background:var(--paper);border-radius:9px;font-size:15px;font-weight:600}
.toolbar button.primary{background:var(--green);color:#fff;border-color:var(--green)}
.empty{text-align:center;color:var(--ink2);padding:44px 20px;font-size:15px}
.note{background:var(--blue-bg);border:1px solid #BBD3E8;border-radius:var(--r);padding:12px 14px;font-size:14px;margin-bottom:12px}
.note b{display:block;margin-bottom:4px}
.err{background:var(--red-bg);border:1px solid #E8B7B3;color:var(--red);border-radius:var(--r);padding:10px 14px;font-size:14px;margin-bottom:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;z-index:60;background:var(--ink);color:#fff;
  padding:12px 20px;border-radius:999px;font-size:15px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* ---- offline / photos ---- */
.photo-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.photo-actions button{min-height:52px}
.photo-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.photo-card{position:relative;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--field)}
.photo-card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#DCE4DF}
.photo-card .pm{padding:7px 8px;font-size:12px;color:var(--ink2);line-height:1.35}
.photo-card .pm b{display:block;color:var(--ink);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.photo-card .pdel{position:absolute;right:6px;top:6px;min-width:44px;min-height:44px;border:0;border-radius:8px;background:rgba(20,35,28,.82);color:#fff;font-weight:700}
.storage-line{font-size:12px;color:var(--ink2);margin-top:7px}
@media (min-width:640px){.photo-list{grid-template-columns:repeat(3,minmax(0,1fr))}}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="htitle">樹木点検 現地入力</div>
    <span class="badge" id="netBadge">オンライン</span>
    <span class="badge" id="cntBadge">0本</span>
    <span class="badge" id="storeBadge">端末保存</span>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-entry" aria-selected="true">入力</button>
    <button role="tab" id="tab-list" aria-selected="false">一覧</button>
    <button role="tab" id="tab-out" aria-selected="false">書き出し</button>
  </div>
</header>

<main>
  <div id="view-entry"></div>
  <div id="view-list" hidden></div>
  <div id="view-out" hidden></div>
</main>

<div class="resultbar" id="resultbar">
  <div class="rgrid">
    <div class="rtext">
      <div class="rline1" id="rl1">樹木番号と樹種を入れてください</div>
      <div class="rline2" id="rl2"></div>
    </div>
    <button class="save" id="btnSave" disabled>保存</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

const LIFE = ["生存","枯死","切株","不明"];
const SITE = ["公園・広場","住宅周辺緑地","通路・園路沿い","駐車場周辺","道路沿い","施設敷地内緑地","その他"];

const LAND = ["住宅","集合住宅","商業・業務","工業","道路・交通","公園・緑地","公共施設","農地","空地","その他"];

const CHK2 = ["葉の状態","先端枝の枯れ","枯死・著しい衰弱","キノコの有無","開口空洞","樹皮枯死・欠損・腐朽","裂け・亀裂・接合部異常","病虫害","根元・根株の異常","揺れ","不自然な傾斜"];
const CHK3 = ["土壌踏圧・固結・過度な被覆","盛土・深植え・根元埋没","掘削・根切り・造成/工事損傷","排水不良・過湿/著しい乾燥","根系空間不足・植栽基盤狭小"];

const LEGACY_LS_REC = "treefield.records.v1";
const LEGACY_LS_CFG = "treefield.config.v1";
const LEGACY_LS_DRAFT = "treefield.draft.v1";
const DB_NAME = "treefield.db";
const DB_VERSION = 1;
const STORE_RECORDS = "records";
const STORE_PHOTOS = "photos";
const STORE_SETTINGS = "settings";
const STORE_SYNC = "syncQueue";

let cfg = {mode:"A", surveyor:"", date:new Date().toISOString().slice(0,10), prefix:"K-", next:1};
let records = [];
let cur = blank();
let editingId = null;
let idb = null;
let draftTimer = null;
let photoUrls = [];

// localStorageは、折りたたみ状態と旧版データの移行元にだけ使用する。
function lsGet(k, fb){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }catch(e){ return fb; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : Date.now()+"-"+Math.random().toString(36).slice(2)); }

function openTreeDb(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains(STORE_RECORDS)) d.createObjectStore(STORE_RECORDS,{keyPath:"id"});
      if (!d.objectStoreNames.contains(STORE_SETTINGS)) d.createObjectStore(STORE_SETTINGS,{keyPath:"key"});
      if (!d.objectStoreNames.contains(STORE_SYNC)) d.createObjectStore(STORE_SYNC,{keyPath:"id"});
      if (!d.objectStoreNames.contains(STORE_PHOTOS)) {
        const s = d.createObjectStore(STORE_PHOTOS,{keyPath:"id"});
        s.createIndex("recordId","recordId",{unique:false});
        s.createIndex("treeNo","treeNo",{unique:false});
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error("IndexedDBを開けません"));
  });
}
function idbReq(store, mode, fn){
  return new Promise((resolve,reject)=>{
    const tx = idb.transaction(store,mode), os = tx.objectStore(store);
    let req, result, failed=false;
    try{ req = fn(os); }catch(e){ reject(e); return; }
    req.onsuccess = () => { result=req.result; };
    req.onerror = () => { failed=true; reject(req.error); };
    tx.oncomplete = () => { if(!failed) resolve(result); };
    tx.onerror = () => { if(!failed){ failed=true; reject(tx.error || new Error("保存処理に失敗しました")); } };
    tx.onabort = () => { if(!failed){ failed=true; reject(tx.error || new Error("保存処理が中断されました")); } };
  });
}
function dbGet(store,key){ return idbReq(store,"readonly",os=>os.get(key)); }
function dbGetAll(store){ return idbReq(store,"readonly",os=>os.getAll()); }
function dbPut(store,value){ return idbReq(store,"readwrite",os=>os.put(value)); }
function dbDelete(store,key){ return idbReq(store,"readwrite",os=>os.delete(key)); }
async function getSetting(key,fb){ const x=await dbGet(STORE_SETTINGS,key); return x ? x.value : fb; }
function saveSetting(key,value){ return dbPut(STORE_SETTINGS,{key,value,updatedAt:new Date().toISOString()}); }
function deleteSetting(key){ return dbDelete(STORE_SETTINGS,key); }
function persistCfg(){ return saveSetting("cfg",cfg); }
function persistDraft(){
  clearTimeout(draftTimer);
  draftTimer=setTimeout(()=>saveSetting("draft",{cur,editingId}).catch(()=>{}),250);
}

async function migrateLegacy(){
  const done = await getSetting("legacyMigrated",false);
  if (done) return 0;

  const existing = await dbGetAll(STORE_RECORDS);

      r.id = r.id || uid();
      r.photoIds = Array.isArray(r.photoIds) ? r.photoIds : [];
      await dbPut(STORE_RECORDS,r); moved++;
    }
